};

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function startPartTraining(part) {
  const actions = getActionsByPart(part);
  if (actions.length === 0) {
    showToast('该部位还没有动作');
    return;
  }
  training.actions = actions;
  training.actionIndex = 0;
  training.bodyPart = part;
  training.trainingLog = [];
  training.active = true;
  const empty = document.getElementById('session-empty');
  if (empty) empty.style.display = 'none';
  loadAction(0);
  switchView('training');
}

/* ===== 计时页显示 ===== */
function showSession() {
  updateTrainingUI();
}

/* 结束/放弃训练后重置会话，回到首页选部位 */
function resetTrainingSession() {
  clearTimers();
  training.trainingLog = [];
  training.currentGroup = 1;
  training.totalGroups = 1;
  training.active = false;
  training.currentAction = null;
  training.actions = [];
  switchView('home');
}

function loadAction(index) {
  const action = training.actions[index];
  if (!action) return;
  const existingLog = training.trainingLog.find(g => g.actionName === action.name);
  const groupCount = existingLog ? existingLog.groups.length : 0;
  clearTimers();
  training.currentAction = action;
  // 按组数使用 setsConfig 配置
  const setIdx = groupCount; // 当前要做的组索引（0-based）
  const sc = action.setsConfig && action.setsConfig[setIdx];
  training.weight = sc ? sc.weight : action.defaultWeight;
  training.reps = sc ? sc.reps : action.defaultReps;
  training.currentGroup = groupCount + 1;
  training.totalGroups = groupCount + 1;
  training.phase = 'idle';
  training.trainingSeconds = 0;
  training.restSeconds = action.restSeconds;
  training.prepareSeconds = action.prepareSeconds ?? 15;
  training.restVibrationFired = false;
  training.timerDisplay = '00:00';
  training.timerLabel = groupCount > 0 ? `准备开始第 ${groupCount + 1} 组` : '准备开始第一组';
  document.getElementById('tr-timer').classList.remove('warning');
  updateTrainingUI();
}

function updateTrainingUI() {
  const a = training.currentAction;
  if (!a) return;
  // 顶部信息条：部位 + 动作 + 组数进度（已做/目标）
  document.getElementById('tr-si-part').textContent = training.bodyPart;
  document.getElementById('tr-si-name').textContent = a.name;
  const doneLog = training.trainingLog.find(g => g.actionName === a.name);
  const doneGroups = doneLog ? doneLog.groups.length : 0;
  document.getElementById('tr-si-groups').textContent = `${doneGroups}/${a.targetSets ?? 3} 组`;
  // 同步滑动选择器显示
  updatePicker('weight');
  updatePicker('reps');
  document.getElementById('tr-timer-num').textContent = training.timerDisplay;
  document.getElementById('tr-timer-label').textContent = training.timerLabel;

  // 主按钮文案与状态
  const btn = document.getElementById('tr-record-btn');
  const btnText = document.getElementById('tr-record-btn-text');
  const timerHint = document.getElementById('tr-timer-hint');
  const timerEl = document.getElementById('tr-timer');

  if (training.phase === 'idle') {
    btnText.textContent = '开始计时';
    btn.disabled = false;
    timerHint.style.display = 'none';
    timerEl.classList.remove('warning');
  } else if (training.phase === 'preparing') {
    btnText.textContent = '准备中...';
    btn.disabled = true;
    timerHint.style.display = 'block';
    timerEl.classList.remove('warning');
  } else if (training.phase === 'training') {
    btnText.textContent = '结束本组，开始休息';
    btn.disabled = false;
    timerHint.style.display = 'none';
    timerEl.classList.remove('warning');
  } else if (training.phase === 'resting') {
    btnText.textContent = '休息中...';
    btn.disabled = true;
    timerHint.style.display = 'block';
  }

  // 休息时长调节键：仅休息阶段显示
  const restAdj = document.getElementById('rest-adjust');
  if (restAdj) restAdj.style.display = training.phase === 'resting' ? 'flex' : 'none';

  // 休息最后30秒警告样式
  if (training.phase === 'resting' && training.restSeconds <= 30) {
    timerEl.classList.add('warning');
  } else {
    timerEl.classList.remove('warning');
  }

  // 上下动作切换：计时中也允许（nextAction/prevAction 会先停掉当前计时），
  // 仅在到达首尾动作时禁用对应按钮
  document.getElementById('tr-prev').disabled = training.actionIndex === 0;
  document.getElementById('tr-next').disabled = training.actionIndex === training.actions.length - 1;
}

/* ===== 左右滑动选择器（重量 / 次数） ===== */
function pickerConfig(field) {
  if (field === 'weight') return { step: 2.5, min: 0, max: 500, decimals: 1 };
  return { step: 1, min: 0, max: 99, decimals: 0 };
}
function formatPickerVal(field, v) {
  const cfg = pickerConfig(field);
  if (cfg.decimals > 0) {
    v = Math.round(v * 10) / 10;
    return Number.isInteger(v) ? v.toString() : v.toFixed(cfg.decimals);
  }
  return Math.round(v).toString();
}
function updatePicker(field) {
  const picker = document.getElementById('picker-' + field);
  if (!picker) return;
  const cfg = pickerConfig(field);
  const cur = field === 'weight' ? training.weight : training.reps;
  const prev = Math.max(cfg.min, +(cur - cfg.step).toFixed(cfg.decimals));
  const next = Math.min(cfg.max, +(cur + cfg.step).toFixed(cfg.decimals));
  const track = picker.querySelector('.slide-track');
  track.querySelector('.slide-prev').textContent = formatPickerVal(field, prev);
  track.querySelector('.slide-cur').textContent = formatPickerVal(field, cur);
  track.querySelector('.slide-next').textContent = formatPickerVal(field, next);
  // 到达边界时清空对应预览，避免显示错误值
  if (cur <= cfg.min) track.querySelector('.slide-prev').textContent = '';
  if (cur >= cfg.max) track.querySelector('.slide-next').textContent = '';
}
function adjustWeight(delta) {
  let w = training.weight + delta;
  const cfg = pickerConfig('weight');
  w = Math.max(cfg.min, Math.min(cfg.max, w));
  training.weight = Math.round(w * 10) / 10;
  updatePicker('weight');
}
function adjustReps(delta) {
  let r = training.reps + delta;
  const cfg = pickerConfig('reps');
  r = Math.max(cfg.min, Math.min(cfg.max, r));
  training.reps = r;
  updatePicker('reps');
}

/* 滑动手势：绝对坐标模型，跟手无阻尼，边界硬停即回，惯性 rAF 指数衰减 */
function initPickers() {
  document.querySelectorAll('.slide-picker').forEach(picker => {
    const track = picker.querySelector('.slide-track');
    const field = picker.dataset.field;
    const cfg = pickerConfig(field);
    const adjustFn = field === 'weight' ? adjustWeight : adjustReps;
    const curVal = () => field === 'weight' ? training.weight : training.reps;
    const itemW = () => picker.clientWidth / 3;

    let pointerId = null;
    let startX = 0;        // 手势起点 X（绝对坐标，全程不重置）
    let v0 = 0;            // 手势起点数值
    let moved = false;     // 区分点击与拖动
    let inertiaRaf = null; // 惯性动画句柄
    let lastSnapTimer = null;

    const samples = []; // {x, t} 速度采样

    const applyTransform = (px) => {
      // 跟手位移：px 已折算到 ±半格内
      track.style.transform = `translate3d(${px}px, 0, 0)`;
    };

    // 由手势绝对位移计算：夹紧后的连续步进位置（单位：格）、当前应显示数值、视觉偏移
    const computeDragState = (x) => {
      const iw = itemW();
      const stepsFloat = (startX - x) / iw;        // 左滑为正 = 数值增大
      const minSteps = (cfg.min - v0) / cfg.step;  // ≤ 0
      const maxSteps = (cfg.max - v0) / cfg.step;  // ≥ 0
      const pos = Math.max(minSteps, Math.min(maxSteps, stepsFloat)); // 边界硬停，无过冲
      const val = v0 + Math.round(pos) * cfg.step;
      const visual = -(pos - Math.round(pos)) * iw; // 折算到 ±半格，连续跟手
      return { pos, val, visual };
    };

    const cancelInertia = () => {
      if (inertiaRaf) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
      if (lastSnapTimer) { clearTimeout(lastSnapTimer); lastSnapTimer = null; }
      track.classList.remove('animating');
    };

    const onDown = (e) => {
      cancelInertia();
      pointerId = e.pointerId;
      startX = e.clientX;
      v0 = curVal();
      moved = false;
      samples.length = 0;
      samples.push({ x: e.clientX, t: performance.now() });
      applyTransform(0);
      try { picker.setPointerCapture && picker.setPointerCapture(e.pointerId); } catch (_) {}
    };

    const onMove = (e) => {
      if (e.pointerId !== pointerId) return;
      const x = e.clientX;
      const now = performance.now();
      samples.push({ x, t: now });
      while (samples.length > 1 && now - samples[0].t > 100) samples.shift();
      if (Math.abs(x - startX) > 4) moved = true;

      const st = computeDragState(x);
      if (st.val !== curVal()) adjustFn(st.val - curVal()); // 实时跨步更新数值
      applyTransform(st.visual);
    };

    const onUp = (e) => {
      if (e.pointerId !== pointerId) return;
      pointerId = null;
      try { picker.releasePointerCapture && picker.releasePointerCapture(e.pointerId); } catch (_) {}

      const iw = itemW();

      // 速度：最近采样窗口内「格/ms」（正 = 左滑 = 数值增大）
      let vSteps = 0;
      if (samples.length >= 2) {
        const first = samples[0], last = samples[samples.length - 1];
        const dt = Math.max(16, last.t - first.t);
        vSteps = (first.x - last.x) / iw / dt;
      }

      const st = computeDragState(e.clientX);
      if (moved && Math.abs(vSteps) > 0.04) {
        // 惯性：力度→距离成正比，easeOutCubic 定点收尾，确定性无残留
        const dir = vSteps > 0 ? 1 : -1;
        const extra = Math.min(20, Math.round(Math.abs(vSteps) * 60)); // 快滑多走，慢滑少走
        const minSteps = (cfg.min - v0) / cfg.step;
        const maxSteps = (cfg.max - v0) / cfg.step;
        const startPos = st.pos;
        const target = Math.max(minSteps, Math.min(maxSteps, startPos + dir * extra)); // 边界硬停
        const dur = 240 + Math.min(220, Math.abs(target - startPos) * 12);
        const t0 = performance.now();

        const frame = (t) => {
          const p = Math.min(1, (t - t0) / dur);
          const ease = 1 - Math.pow(1 - p, 3);
          const pos = startPos + (target - startPos) * ease;
          const val = v0 + Math.round(pos) * cfg.step;
          if (val !== curVal()) adjustFn(val - curVal());
          applyTransform(-(pos - Math.round(pos)) * iw);
          if (p < 1) {
            inertiaRaf = requestAnimationFrame(frame);
          } else {
            inertiaRaf = null;
            track.classList.add('animating');
            applyTransform(0); // 吸附回正
            updatePicker(field);
            lastSnapTimer = setTimeout(() => track.classList.remove('animating'), 240);
          }
        };
        inertiaRaf = requestAnimationFrame(frame);
      } else {
        // 慢拖/点击：直接吸附回正（数值已实时定好）
        track.classList.add('animating');
        applyTransform(0);
        updatePicker(field);
        lastSnapTimer = setTimeout(() => track.classList.remove('animating'), 240);
      }
    };

    picker.addEventListener('pointerdown', onDown);
    picker.addEventListener('pointermove', onMove);
    picker.addEventListener('pointerup', onUp);
    picker.addEventListener('pointercancel', onUp);
    // 阻止触摸滚动干扰横向滑动
    picker.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  });
}

function recordGroup() {
  const { currentAction, weight, reps, currentGroup, trainingLog, trainingSeconds } = training;
  let existing = trainingLog.find(g => g.actionName === currentAction.name);
  const groupData = { weight, reps, groupNum: currentGroup, duration: trainingSeconds, restDuration: 0 };
  if (existing) {
    existing.groups.push(groupData);
  } else {
    trainingLog.push({
      actionName: currentAction.name,
      groups: [groupData]
    });
  }
  training.currentGroup = currentGroup + 1;
  training.totalGroups = currentGroup + 1;
}

/* ===== 状态机主按钮（严格串行：同一时刻只有一个计时器） ===== */
function toggleTraining() {
  if (training.phase === 'idle') {
    // 点击1：开始开始倒计时，倒计时结束后自动进入训练正计时
    startPrepareTimer();
  } else if (training.phase === 'training') {
    // 点击2：结束本组并记录，开始休息倒计时
    recordGroup();
    startRestTimer();
  }
  // preparing/resting 状态下按钮禁用，不响应
}

/* 启动开始倒计时（单一定时器） */
function startPrepareTimer() {
  clearActiveInterval();
  // 加载下一组的 setsConfig 重量次数
  const setIdx = training.currentGroup - 1; // 0-based
  const sc = training.currentAction.setsConfig && training.currentAction.setsConfig[setIdx];
  if (sc) {
    training.weight = sc.weight;
    training.reps = sc.reps;
  }
  // 全局准备倒计时开关：关闭则直接进入训练正计时
  if (!isPrepareEnabled()) {
    startTrainingTimer();
    return;
  }
  const prepareTotal = getPrepareSeconds();
  // 如果设置为0秒，直接跳过倒计时进入训练
  if (prepareTotal <= 0) {
    startTrainingTimer();
    return;
  }
  training.phase = 'preparing';
  training.prepareSeconds = prepareTotal;
  training.timerDisplay = formatTime(prepareTotal);
  training.timerLabel = `准备中... 第 ${training.currentGroup} 组即将开始`;
  document.getElementById('tr-timer').classList.remove('warning');
  updateTrainingUI();

  training.activeInterval = setInterval(() => {
    training.prepareSeconds -= 1;
    // 最后3秒震动提醒
    if (training.prepareSeconds <= 3 && training.prepareSeconds > 0) {
      buzz(100);
    }
    if (training.prepareSeconds <= 0) {
      // 倒计时结束：震动 + 自动进入训练正计时
      clearActiveInterval();
      triggerVibration();
      startTrainingTimer();
    } else {
      training.timerDisplay = formatTime(training.prepareSeconds);
      updateTrainingUI();
    }
  }, 1000);
}

/* 启动训练正计时（单一定时器） */
function startTrainingTimer() {
  clearActiveInterval();
  training.phase = 'training';
  training.trainingSeconds = 0;
  training.timerDisplay = '00:00';
  training.timerLabel = `第 ${training.currentGroup} 组训练中...`;
  document.getElementById('tr-timer').classList.remove('warning');
  updateTrainingUI();

  training.activeInterval = setInterval(() => {
    training.trainingSeconds += 1;
    training.timerDisplay = formatTime(training.trainingSeconds);
    updateTrainingUI();
  }, 1000);
}

/* 启动休息倒计时（单一定时器，停止训练计时） */
function startRestTimer() {
  clearActiveInterval();
  const restTotal = training.currentAction.restSeconds;
  training.restDurationTotal = restTotal; // 记录本组休息总时长（含后续调节）
  training.phase = 'resting';
  training.restSeconds = restTotal;
  training.restVibrationFired = false;
  training.timerDisplay = formatTime(restTotal);
  training.timerLabel = `休息中... 第 ${training.currentGroup} 组准备`;
  updateTrainingUI();

  training.activeInterval = setInterval(() => {
    training.restSeconds -= 1;
    // 剩余30秒触发震动（仅一次；短休息也能触发）
    if (training.restSeconds <= 30 && !training.restVibrationFired) {
      triggerVibration();
      training.restVibrationFired = true;
    }
    if (training.restSeconds <= 0) {
      // 休息结束：回填上一组的休息时长 = 休息倒计时 + 准备倒计时（若开启）
      attachRestDurationToLastGroup();
      clearActiveInterval();
      const timerEl = document.getElementById('tr-timer');
      timerEl.classList.add('rest-finished-pulse');
      setTimeout(() => timerEl.classList.remove('rest-finished-pulse'), 600);
      startPrepareTimer(); // 自动进入下一组开始倒计时 → 训练
    } else {
      training.timerDisplay = formatTime(training.restSeconds);
      updateTrainingUI();
    }
  }, 1000);
}

/* 把本次休息时长（休息倒计时 + 准备倒计时若开启）回填到刚完成的那一组 */
function attachRestDurationToLastGroup() {
  const log = training.trainingLog;
  if (!log || log.length === 0) return;
  const lastAction = log[log.length - 1];
  if (!lastAction.groups || lastAction.groups.length === 0) return;
  const lastGroup = lastAction.groups[lastAction.groups.length - 1];
  const prepareSec = isPrepareEnabled() ? getPrepareSeconds() : 0;
  lastGroup.restDuration = (training.restDurationTotal || 0) + prepareSec;
}

/* 震动开关（默认开启；iOS Safari 不支持 Vibration API） */
function isVibrationEnabled() {
  return localStorage.getItem(VIBRATION_KEY) !== '0';
}
function setVibrationEnabled(on) {
  localStorage.setItem(VIBRATION_KEY, on ? '1' : '0');
  const t = document.getElementById('vibration-toggle');
  if (t) t.checked = on;
  // 开启时给一下确认震动，让用户立刻感知
  if (on) buzz(120);
}

/* 准备倒计时开关（默认开启） */
function isPrepareEnabled() {
  return localStorage.getItem(PREPARE_ENABLED_KEY) !== '0';
}
function setPrepareEnabled(on) {
  localStorage.setItem(PREPARE_ENABLED_KEY, on ? '1' : '0');
  const t = document.getElementById('prepare-toggle');
  if (t) t.checked = on;
  updatePrepareSecondsRow();
}
/* 准备倒计时秒数（默认15，范围1~300） */
function getPrepareSeconds() {
  const v = parseInt(localStorage.getItem(PREPARE_SECONDS_KEY), 10);
  return (v && v > 0) ? v : 15;
}
function setPrepareSeconds(sec) {
  sec = Math.max(1, Math.min(300, parseInt(sec, 10) || 15));
  localStorage.setItem(PREPARE_SECONDS_KEY, String(sec));
  const inp = document.getElementById('prepare-seconds-input');
  if (inp) inp.value = sec;
}
/* 联动：开关关闭时禁用时间输入 */
function updatePrepareSecondsRow() {
  const row = document.getElementById('prepare-seconds-row');
  const inp = document.getElementById('prepare-seconds-input');
  if (!row) return;
  const on = isPrepareEnabled();
  row.style.opacity = on ? '1' : '0.45';
  row.style.pointerEvents = on ? 'auto' : 'none';
  if (inp) inp.disabled = !on;
}
/* 统一震动入口：受开关控制，不支持时静默 */
function buzz(pattern) {
  if (isVibrationEnabled() && navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch(e) {}
  }
}

/* 震动反馈（Web Vibration API + 视觉降级，视觉抖动始终保留） */
function triggerVibration() {
  buzz([200, 100, 200]);
  const timerEl = document.getElementById('tr-timer');
  timerEl.classList.add('shake-alert');
  setTimeout(() => timerEl.classList.remove('shake-alert'), 1500);
}

/* 跳过休息/跳过准备：按阶段正确流转 */
function skipRest() {
  if (training.phase === 'resting') {
    // 跳过休息 → 回填上一组休息时长（按已设定的休息总时长计），再进入下一组准备倒计时
    clearActiveInterval();
    attachRestDurationToLastGroup();
    const timerEl = document.getElementById('tr-timer');
    timerEl.classList.add('rest-finished-pulse');
    setTimeout(() => timerEl.classList.remove('rest-finished-pulse'), 600);
    startPrepareTimer();
  } else if (training.phase === 'preparing') {
    // 跳过准备 → 直接进入训练
    const timerEl = document.getElementById('tr-timer');
    timerEl.classList.add('rest-finished-pulse');
    setTimeout(() => timerEl.classList.remove('rest-finished-pulse'), 600);
    startTrainingTimer();
  }
}

function nextAction() {
  // 计时中也允许切换动作：先停止当前计时，再切到下一个
  const next = training.actionIndex + 1;
  if (next >= training.actions.length) {
    showToast('已经是最后一个动作');
    return;
  }
  clearTimers();
  training.actionIndex = next;
  loadAction(next);
}
function prevAction() {
  const prev = training.actionIndex - 1;
  if (prev < 0) {
    showToast('已经是第一个动作');
    return;
  }
  clearTimers();
  training.actionIndex = prev;
  loadAction(prev);
}

function endTraining() {
  const log = training.trainingLog;
  const existingGroups = log.reduce((sum, g) => sum + g.groups.length, 0);
  // training 状态下会额外记录当前组
  const willAddCurrent = training.phase === 'training';
  // 没有任何有效记录：直接放弃会话，回到启动页
  if (existingGroups === 0 && !willAddCurrent) {
    resetTrainingSession();
    return;
  }
  const totalGroups = existingGroups + (willAddCurrent ? 1 : 0);
  showConfirm('结束训练', `${training.bodyPart}训练将保存 ${totalGroups} 组，确定吗？`, () => {
    // 确认后才记录当前组，避免用户取消时误记录
    if (willAddCurrent) {
      recordGroup();
    }
    saveRecord({ bodyPart: training.bodyPart, actions: training.trainingLog });
    resetTrainingSession();
  });
}

/* 仅清除活动定时器（不改变 phase） */
function clearActiveInterval() {
  if (training.activeInterval) { clearInterval(training.activeInterval); training.activeInterval = null; }
}

/* 清除定时器并重置为 idle（loadAction/切换动作/结束训练时用） */
function clearTimers() {
  clearActiveInterval();
  training.phase = 'idle';
  document.getElementById('tr-timer').classList.remove('warning', 'shake-alert');
}

/* ============================================================
   设置页：手风琴 + 拖拽排序
   ============================================================ */
let editingId = null;
const expandedParts = new Set(['胸部']); // 默认展开胸部
let draggedActionId = null;

function togglePartSection(part) {
  if (expandedParts.has(part)) expandedParts.delete(part);
  else expandedParts.add(part);
  renderSettings();
}

function renderSettings() {
  const actions = getActions();
  const list = document.getElementById('settings-list');
  const empty = document.getElementById('settings-empty');
  if (actions.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  // 按部位分组，组内按 order 排序
  const partMap = {};
  actions.forEach(a => {
    if (!partMap[a.bodyPart]) partMap[a.bodyPart] = [];
    partMap[a.bodyPart].push(a);
  });
  // 部位顺序按持久化顺序
  const orderedParts = getOrderedParts().filter(p => partMap[p.name] && partMap[p.name].length > 0);

  let html = '';
  orderedParts.forEach((p, partIdx) => {
    const partActions = partMap[p.name].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const isExpanded = expandedParts.has(p.name);
    html += `
      <div class="part-section ${isExpanded ? 'expanded' : ''}" data-part="${p.name}" data-part-idx="${partIdx}">
        <div class="part-swipe-wrap">
          <div class="part-swipe-delete" onclick="askDeletePart('${p.name}')">${icon('trash')}</div>
          <div class="part-section-head" draggable="true" onclick="onPartHeadClick(this, '${p.name}')" ondragstart="onPartDragStart(event, '${p.name}')" ondragover="onPartDragOver(event, '${p.name}')" ondrop="onPartDrop(event, '${p.name}')" ondragend="onPartDragEnd(event)" ontouchstart="onPartSwipeStart(event, '${p.name}')" ontouchmove="onPartSwipeMove(event, '${p.name}')" ontouchend="onPartSwipeEnd(event, '${p.name}')" ontouchcancel="onPartSwipeEnd(event, '${p.name}')">
            <div class="drag-handle part-drag-handle">${icon('grip')}</div>
            <div class="part-section-icon">${icon(p.icon)}</div>
            <div class="part-section-info">
              <div class="part-section-name">${p.name}训练</div>
              <div class="part-section-count">${partActions.length} 个动作</div>
            </div>
            <div class="part-section-arrow">${icon('chevron-right')}</div>
          </div>
        </div>
        <div class="part-section-body">
          ${partActions.map(a => `
            <div class="action-row" draggable="true" data-action-id="${a.id}" data-part="${p.name}">
              <div class="drag-handle">${icon('grip')}</div>
              <div class="action-row-info">
                <div class="action-row-name">${a.name}</div>
                <div class="action-row-detail">${a.targetSets ?? 3}组 · ${(a.setsConfig || []).map((s, i) => `${s.weight}kg×${s.reps}`).join(' / ') || `${a.defaultWeight}kg × ${a.defaultReps}次`}</div>
              </div>
              <div class="action-row-actions" onclick="event.stopPropagation()">
                <button class="mini-btn" onclick="openEditModal('${a.id}')">${icon('pen')}</button>
                <button class="mini-btn" onclick="askDelete('${a.id}')">${icon('trash')}</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });
  list.innerHTML = html;
  bindDragEvents();
}

/* ===== 部位拖拽排序 ===== */
let draggedPartName = null;

function onPartDragStart(e, partName) {
  draggedPartName = partName;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', partName); } catch(e) {}
}

function onPartDragOver(e, partName) {
  if (!draggedPartName || draggedPartName === partName) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const head = e.currentTarget;
  head.classList.add('part-drag-over');
}

function onPartDrop(e, targetPartName) {
  e.preventDefault();
  e.stopPropagation();
  if (!draggedPartName || draggedPartName === targetPartName) return;
  // 重新排列部位顺序
  const order = getPartOrder();
  const fromIdx = order.indexOf(draggedPartName);
  const toIdx = order.indexOf(targetPartName);
  if (fromIdx === -1 || toIdx === -1) return;
  order.splice(fromIdx, 1);
  order.splice(toIdx, 0, draggedPartName);
  savePartOrder(order);
  draggedPartName = null;
  renderSettings();
}

function onPartDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.part-drag-over').forEach(el => el.classList.remove('part-drag-over'));
  draggedPartName = null;
}

/* ===== 拖拽排序事件委托 ===== */
function bindDragEvents() {
  const rows = document.querySelectorAll('.action-row');
  rows.forEach(row => {
    row.addEventListener('dragstart', onDragStart);
    row.addEventListener('dragover', onDragOver);
    row.addEventListener('dragleave', onDragLeave);
    row.addEventListener('drop', onDrop);
    row.addEventListener('dragend', onDragEnd);
  });
  // 移动端：拖拽把手触发 touch 排序（HTML5 draggable 在手机不生效）
  document.querySelectorAll('.action-row .drag-handle').forEach(handle => {
    handle.addEventListener('touchstart', onActionTouchStart, { passive: false });
    handle.addEventListener('touchmove', onActionTouchMove, { passive: false });
    handle.addEventListener('touchend', onActionTouchEnd, { passive: false });
    handle.addEventListener('touchcancel', onActionTouchEnd, { passive: false });
  });
  // 部位头部拖拽把手：touch 排序
  document.querySelectorAll('.part-drag-handle').forEach(handle => {
    handle.addEventListener('touchstart', onPartTouchStart, { passive: false });
    handle.addEventListener('touchmove', onPartTouchMove, { passive: false });
    handle.addEventListener('touchend', onPartTouchEnd, { passive: false });
    handle.addEventListener('touchcancel', onPartTouchEnd, { passive: false });
  });
}

/* ===== 移动端：动作行 touch 排序 =====
   跟手模型：视觉顶边 = 手指Y - 抓取偏移；DOM 重排后布局位置变化，
   必须重新测量 layoutTop 再跟手，否则控件会飘离手指 */
let actionTouch = null;
function onActionTouchStart(e) {
  e.preventDefault();
  e.stopPropagation();
  const row = e.currentTarget.closest('.action-row');
  if (!row) return;
  const y = e.touches[0].clientY;
  const rect = row.getBoundingClientRect(); // 尚无 transform，即布局位置
  actionTouch = {
    row,
    startY: y,
    grabOffset: y - rect.top,  // 手指相对元素顶边的偏移（全程不变）
    layoutTop: rect.top,       // 元素当前布局顶边（重排后更新）
    moved: false
  };
  row.classList.add('dragging');
}
function onActionTouchMove(e) {
  if (!actionTouch) return;
  e.preventDefault();
  e.stopPropagation();
  const row = actionTouch.row;
  const y = e.touches[0].clientY;
  if (Math.abs(y - actionTouch.startY) > 6) actionTouch.moved = true;
  // 跟手：元素钉在手指下方（保持抓取偏移）
  const follow = () => { row.style.transform = `translateY(${y - actionTouch.grabOffset - actionTouch.layoutTop}px)`; };
  follow();
  // 遍历同容器内的行（跳过被拖动行），用 getBoundingClientRect 匹配
  // 非拖动行没有 transform，rect 即真实布局位置
  const container = row.parentElement;
  const rows = Array.from(container.children);
  for (const other of rows) {
    if (other === row) continue;
    const rect = other.getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom) {
      const isAbove = y < rect.top + rect.height / 2;
      if (isAbove) container.insertBefore(row, other);
      else if (other.nextElementSibling) container.insertBefore(row, other.nextElementSibling);
      else container.appendChild(row);
      // 重排后布局位置已变：清 transform 重新测量，再恢复跟手
      row.style.transform = 'none';
      actionTouch.layoutTop = row.getBoundingClientRect().top;
      follow();
      break;
    }
  }
}
function onActionTouchEnd(e) {
  if (!actionTouch) return;
  const row = actionTouch.row;
  row.classList.remove('dragging');
  row.style.transform = '';
  if (actionTouch.moved) persistOrderFromDOM();
  actionTouch = null;
}

/* ===== 移动端：部位 touch 排序（同动作行的重锚定模型） ===== */
let partTouch = null;
function onPartTouchStart(e) {
  e.preventDefault();
  e.stopPropagation();
  const section = e.currentTarget.closest('.part-section');
  if (!section) return;
  const y = e.touches[0].clientY;
  const rect = section.getBoundingClientRect(); // 尚无 transform，即布局位置
  partTouch = {
    section, partName: section.dataset.part,
    startY: y,
    grabOffset: y - rect.top,
    layoutTop: rect.top,
    moved: false
  };
  section.classList.add('dragging');
}
function onPartTouchMove(e) {
  if (!partTouch) return;
  e.preventDefault();
  e.stopPropagation();
  const section = partTouch.section;
  const y = e.touches[0].clientY;
  if (Math.abs(y - partTouch.startY) > 6) partTouch.moved = true;
  // 跟手：元素钉在手指下方（保持抓取偏移）
  const follow = () => { section.style.transform = `translateY(${y - partTouch.grabOffset - partTouch.layoutTop}px)`; };
  follow();
  // 遍历部位（跳过被拖动的），非拖动部位无 transform，rect 即真实布局位置
  const container = section.parentElement;
  const sections = Array.from(container.children);
  for (const sec of sections) {
    if (sec === section) continue;
    const rect = sec.getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom) {
      const isAbove = y < rect.top + rect.height / 2;
      if (isAbove) container.insertBefore(section, sec);
      else if (sec.nextElementSibling) container.insertBefore(section, sec.nextElementSibling);
      else container.appendChild(section);
      // 重排后布局位置已变：清 transform 重新测量，再恢复跟手
      section.style.transform = 'none';
      partTouch.layoutTop = section.getBoundingClientRect().top;
      follow();
      break;
    }
  }
}
function onPartTouchEnd(e) {
  if (!partTouch) return;
  const section = partTouch.section;
  section.classList.remove('dragging');
  section.style.transform = '';
  if (partTouch.moved) {
    // 按 DOM 新顺序保存部位顺序
    const order = Array.from(document.querySelectorAll('.part-section')).map(s => s.dataset.part);
    savePartOrder(order);
    renderSettings();
  }
  partTouch = null;
}

function onDragStart(e) {
  draggedActionId = e.currentTarget.dataset.actionId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  // Firefox 需要设置数据才能触发拖拽
  try { e.dataTransfer.setData('text/plain', draggedActionId); } catch(e) {}
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.currentTarget;
  if (row.dataset.actionId === draggedActionId) return;
  // 清掉其他指示
  document.querySelectorAll('.action-row').forEach(r => {
    if (r !== row) { r.classList.remove('drag-over-top'); r.classList.remove('drag-over-bottom'); }
  });
  // 根据鼠标位置决定在上半还是下半
  const rect = row.getBoundingClientRect();
  const isAbove = (e.clientY - rect.top) < rect.height / 2;
  row.classList.toggle('drag-over-top', isAbove);
  row.classList.toggle('drag-over-bottom', !isAbove);
}

function onDragLeave(e) {
  const row = e.currentTarget;
  row.classList.remove('drag-over-top');
  row.classList.remove('drag-over-bottom');
}

function onDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetRow = e.currentTarget;
  const targetId = targetRow.dataset.actionId;
  if (targetId === draggedActionId) return;

  const isAbove = targetRow.classList.contains('drag-over-top');
  if (!isAbove) {
    // 插到目标行后面
    const nextSibling = targetRow.nextElementSibling;
    const draggedRow = document.querySelector('.action-row.dragging');
    if (nextSibling) targetRow.parentElement.insertBefore(draggedRow, nextSibling);
    else targetRow.parentElement.appendChild(draggedRow);
  } else {
    const draggedRow = document.querySelector('.action-row.dragging');
    targetRow.parentElement.insertBefore(draggedRow, targetRow);
  }
  targetRow.classList.remove('drag-over-top', 'drag-over-bottom');
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.action-row').forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
  // 关键：读取 DOM 新顺序，写回 order 并持久化
  persistOrderFromDOM();
  draggedActionId = null;
}

function persistOrderFromDOM() {
  const actions = getActions();
  // 遍历所有部位 section，按 DOM 顺序收集 action id
  const newOrderIds = {};
  document.querySelectorAll('.part-section').forEach(section => {
    const part = section.dataset.part;
    const ids = Array.from(section.querySelectorAll('.action-row')).map(r => r.dataset.actionId);
    newOrderIds[part] = ids;
  });
  // 更新每个动作的 order
  Object.keys(newOrderIds).forEach(part => {
    newOrderIds[part].forEach((id, index) => {
      const action = actions.find(a => a.id === id);
      if (action) action.order = index;
    });
  });
  saveActions(actions);
  // 不重渲染，保持当前拖拽后的 DOM 顺序
}

  if (selected) sel.value = selected;
}

/* 每组重量次数配置 */
let setsConfigCache = []; // 临时存储编辑中的每组配置

function renderSetsConfig() {
  const count = Math.max(1, parseInt(document.getElementById('edit-sets').value) || 3);
  const defaultWeight = parseFloat(document.getElementById('edit-weight').value) || 0;
  const defaultReps = parseInt(document.getElementById('edit-reps').value) || 0;
  // 调整 cache 长度，保留已有值，新增的用默认值填充
  while (setsConfigCache.length < count) {
    setsConfigCache.push({ weight: defaultWeight, reps: defaultReps });
  }
  if (setsConfigCache.length > count) {
    setsConfigCache = setsConfigCache.slice(0, count);
  }
  const list = document.getElementById('sets-config-list');
  list.innerHTML = setsConfigCache.map((s, i) => `
    <div class="set-config-row">
      <div class="set-config-num">${i + 1}</div>
      <div class="set-config-inputs">
        <input type="number" step="0.5" min="0" value="${s.weight}" placeholder="重量" oninput="updateSetConfig(${i}, 'weight', this.value)">
        <label>kg</label>
        <input type="number" min="0" value="${s.reps}" placeholder="次数" oninput="updateSetConfig(${i}, 'reps', this.value)">
        <label>次</label>
      </div>
    </div>
  `).join('');
}

function updateSetConfig(index, field, value) {
  if (!setsConfigCache[index]) setsConfigCache[index] = { weight: 0, reps: 0 };
  setsConfigCache[index][field] = field === 'weight' ? parseFloat(value) || 0 : parseInt(value) || 0;
}

function openEditModal(id) {

  editingId = id;
  document.getElementById('edit-title').textContent = '编辑动作';

      setsConfigCache.push({ weight: action.defaultWeight, reps: action.defaultReps });
    }

      setsConfigCache.push({ weight: action.defaultWeight, reps: action.defaultReps });
    }
  }
  populatePartSelect(action.bodyPart);
  renderSetsConfig();
  document.getElementById('modal-edit').style.display = 'flex';

function closeEditModal(e) {

  document.getElementById('modal-edit').style.display = 'none';

function saveAction() {
  const name = document.getElementById('edit-name').value.trim();
  const bodyPart = document.getElementById('edit-part').value;
  const weight = parseFloat(document.getElementById('edit-weight').value);
  const reps = parseInt(document.getElementById('edit-reps').value);
  const sets = parseInt(document.getElementById('edit-sets').value);
  const prepare = parseInt(document.getElementById('edit-prepare').value);
  const rest = parseInt(document.getElementById('edit-rest').value);

  if (!name) { showToast('请输入动作名称'); return; }
  if (isNaN(weight) || weight < 0) { showToast('请输入有效重量'); return; }
  if (isNaN(reps) || reps < 0) { showToast('请输入有效次数'); return; }
  if (isNaN(sets) || sets < 1) { showToast('组数至少1组'); return; }
  if (isNaN(prepare) || prepare < 0) { showToast('开始倒计时不小于0'); return; }
  if (isNaN(rest) || rest < 1) { showToast('休息时间至少1秒'); return; }

  const data = { name, bodyPart, defaultWeight: weight, defaultReps: reps, targetSets: sets, prepareSeconds: prepare, restSeconds: rest, setsConfig: setsConfigCache.map(s => ({ weight: s.weight, reps: s.reps })) };
  if (editingId) {
    updateAction(editingId, data);
  } else {
    addAction(data);
  }
  document.getElementById('modal-edit').style.display = 'none';
  renderSettings();
  renderHome();

/* ===== 部位左滑删除（手势状态机） =====
   关键点：
   - 位移以「手势开始时的位置」为基准（base），展开态右滑也能跟手；
   - 首次明显移动时锁定方向，纵向交给页面滚动，横向才接管；
   - 松手按「速度（轻扫）+ 位置（过半）」对称吸附，左右手感一致；
   - 横向滑动后抑制合成 click，避免误触展开/折叠。 */
const SWIPE_ACTION_W = 80;          // 删除按钮宽度（与 CSS 一致）
const SWIPE_LOCK_PX = 8;            // 方向判定阈值（越小越灵敏）
const SWIPE_FLICK_V = 0.35;         // 轻扫速度阈值 px/ms
let swipeGesture = null;

function onPartSwipeStart(e, partName) {
  const touch = e.touches[0];
  const el = e.currentTarget;
  const base = el.classList.contains('swipe-open') ? -SWIPE_ACTION_W : 0;
  swipeGesture = {
    el, partName,
    startX: touch.clientX, startY: touch.clientY,
    base, x: base,
    axis: null,                       // null | 'x' | 'y'
    samples: []                       // 最近移动采样 {x, t}，用于松手速度
  };
  el.classList.add('swipe-drag');
  // 关闭其他已展开的行（带动画回收）
  document.querySelectorAll('.part-section-head.swipe-open').forEach(other => {
    if (other !== el) other.classList.remove('swipe-open');
  });
}

function onPartSwipeMove(e, partName) {
  const g = swipeGesture;
  if (!g || g.el !== e.currentTarget) return;
  const touch = e.touches[0];
  const dx = touch.clientX - g.startX;
  const dy = touch.clientY - g.startY;

  // 首次移动：锁定方向
  if (!g.axis) {
    if (Math.abs(dx) < SWIPE_LOCK_PX && Math.abs(dy) < SWIPE_LOCK_PX) return;
    g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (g.axis === 'y') return; // 纵向：不拦截，页面正常滚动

  e.preventDefault();
  // 以 base 为基准跟手，钳制在 [-80, 0]
  const x = Math.max(-SWIPE_ACTION_W, Math.min(0, g.base + dx));
  g.x = x;
  // 记录最近 80ms 移动采样，松手时算窗口平均速度（px/ms）
  const now = Date.now();
  g.samples.push({ x, t: now });
  while (g.samples.length > 2 && now - g.samples[0].t > 80) g.samples.shift();
  g.el.style.transform = `translate3d(${x}px, 0, 0)`;
}

function onPartSwipeEnd(e, partName) {
  const g = swipeGesture;
  if (!g || g.el !== e.currentTarget) return;
  swipeGesture = null;
  const el = g.el;
  el.classList.remove('swipe-drag');
  el.style.transform = '';

  if (g.axis !== 'x') return; // 纵向滚动/轻点：保持原状

  // 松手速度：最近窗口内的平均速度（短手势也能准确反映轻扫）
  let vel = 0;
  const s = g.samples;
  if (s.length >= 2) {
    const dt = s[s.length - 1].t - s[0].t;
    if (dt > 0) vel = (s[s.length - 1].x - s[0].x) / dt;
  }
  // 对称吸附：快速轻扫按方向定，否则按是否过半
  const shouldOpen = vel <= -SWIPE_FLICK_V
    ? true
    : vel >= SWIPE_FLICK_V
      ? false
      : g.x < -SWIPE_ACTION_W / 2;
  el.classList.toggle('swipe-open', shouldOpen);

  // 抑制滑动后合成的 click（超过 10px 的横向位移视为滑动而非点击）
  if (Math.abs(g.x - g.base) > 10) el.dataset.swiped = '1';
}

/* 头部点击：滑动后的 click 吞掉；展开态轻点改为收回删除按钮 */
function onPartHeadClick(el, partName) {
  if (el.dataset.swiped === '1') { el.dataset.swiped = '0'; return; }

/* ============================================================
   历史记录页：月历看板 + 日期详情
   ============================================================ */
const calendarState = {
  viewDate: new Date(),   // 当前查看的月份
  selectedDate: null      // 点击选中的日期 key
};

function renderHistory() {
  const records = getRecords();
  const empty = document.getElementById('history-empty');
  const clearBtn = document.getElementById('clear-btn');
  const calWrap = document.querySelector('.calendar-wrap');
  // 日历常驻显示，不再因无记录而隐藏
  calWrap.style.display = 'block';
  renderCalendar();
  // 清空按钮在无记录时隐藏
  clearBtn.style.display = records.length > 0 ? 'block' : 'none';
  // 选中日期时显示详情，否则清空
  if (calendarState.selectedDate) {
    showDateDetail(calendarState.selectedDate, true);
  } else {
    document.getElementById('day-detail-container').innerHTML = '';
  }
  // 空状态提示仅在无记录且未选中日期时显示
  empty.style.display = (records.length === 0 && !calendarState.selectedDate) ? 'flex' : 'none';
}

function renderCalendar() {
  const year = calendarState.viewDate.getFullYear();
  const month = calendarState.viewDate.getMonth();
  document.getElementById('cal-month-title').textContent = `${year}年${month + 1}月`;

  const trainingDates = getTrainingDates();
  const todayKey = formatDateKey(new Date());
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay(); // 0=周日
  const totalDays = lastDay.getDate();

  let html = '';
  // 前置空白
  for (let i = 0; i < startWeekday; i++) {
    html += '<div class="cal-day empty"></div>';
  }
  // 日期格
  for (let d = 1; d <= totalDays; d++) {
    const dateObj = new Date(year, month, d);
    const dateKey = formatDateKey(dateObj);
    const isToday = dateKey === todayKey;
    const hasTraining = trainingDates.has(dateKey);
    const isSelected = dateKey === calendarState.selectedDate;
    const classes = [
      'cal-day',
      isToday ? 'today' : '',
      hasTraining ? 'has-training' : '',
      isSelected ? 'selected' : ''
    ].filter(Boolean).join(' ');
    html += `
      <div class="${classes}" onclick="showDateDetail('${dateKey}')">
        ${d}
        ${hasTraining ? '<span class="cal-day-dot"></span>' : ''}
      </div>
    `;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function changeMonth(delta) {
  calendarState.viewDate.setMonth(calendarState.viewDate.getMonth() + delta);
  renderCalendar();
}

function showDateDetail(dateKey, silent) {
  // 切换选中状态：再次点击同日期则收起
  if (calendarState.selectedDate === dateKey && !silent) {
    calendarState.selectedDate = null;
    document.getElementById('day-detail-container').innerHTML = '';
    renderCalendar();
    return;
  }
  calendarState.selectedDate = dateKey;
  renderCalendar();

  const parts = getRecordsByDate(dateKey);
  const container = document.getElementById('day-detail-container');
  if (parts.length === 0) {
    container.innerHTML = `<div class="day-detail"><div class="detail-empty">${dateKey} 无训练记录</div></div>`;
    return;
  }
  // 计算统计：组数 + 总训练时长（精确到分秒）
  const totalGroups = parts.reduce((sum, p) =>
    sum + p.actions.reduce((s, a) => s + a.groups.length, 0), 0);
  const totalDuration = parts.reduce((sum, p) =>
    sum + p.actions.reduce((s, a) => s + a.groups.reduce((gs, g) => gs + (g.duration || 0), 0), 0), 0);

  container.innerHTML = `
    <div class="day-detail">
      <div class="day-detail-header">
        <div class="day-detail-title">${icon('calendar')} ${dateKey}</div>
        <div class="day-detail-summary">${parts.length}个部位 · ${totalGroups}组 · ${formatTime(totalDuration)}</div>
      </div>
      ${parts.map(p => `
        <div class="detail-part">
          <div class="detail-part-head">
            <span>${icon(p.icon)} ${p.name}训练</span>
            <button class="detail-del-btn" onclick="deletePartRecords('${dateKey}', '${p.recordIds.join(',')}')" title="删除该部位训练记录">
              ${icon('trash')}
            </button>
          </div>
          ${p.actions.map(a => `
            <div class="detail-action">
              <div class="detail-action-name">
                <span>${a.actionName}</span>
                <span style="color:#aeaeb2;font-size:12px">${a.groups.length}组</span>
              </div>
              <div class="detail-sets">
                ${a.groups.map((g, idx) => `
                  <span class="detail-set">
                    <span class="set-num">${idx + 1}</span> ${g.weight}kg×${g.reps}次${g.duration ? ' ·' + formatTime(g.duration) : ''}${g.restDuration ? ' ·休' + formatTime(g.restDuration) : ''}
                  </span>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function clearAll() {
  showConfirm('确认清空', '确定要删除所有训练记录吗？此操作不可恢复！', () => {
    clearRecords();
    calendarState.selectedDate = null;
    renderHistory();
  });
}

/* 删除某日某部位的训练记录（可能含多条同部位记录） */
function deletePartRecords(dateKey, idsStr) {
  const ids = (idsStr || '').split(',').filter(Boolean);
  if (ids.length === 0) return;
  showConfirm('确认删除', `确定要删除 ${dateKey} 的该部位训练记录吗？此操作不可恢复！`, () => {
    deleteRecordsByIds(ids);
    // 删除后若该日已无记录，收起详情
    const remaining = getRecordsByDate(dateKey);
    if (remaining.length === 0) {
      calendarState.selectedDate = null;
    }
    renderHistory();
    showToast('已删除');
  });
}

/* ============================================================
   全屏切换（桌面 / 安卓 Chrome 支持；iOS Safari 不支持则隐藏按钮）
   ============================================================ */
function fsSupported() {
  return !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
}
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  try {
    if (isFullscreen()) {
      if (document.exitFullscreen) { document.exitFullscreen().catch(() => {}); }
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      const el = document.documentElement;
      if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  } catch (e) { /* 不支持时忽略 */ }
}
function updateFullscreenIcon() {
  const btn = document.getElementById('fs-btn');
  if (btn) btn.innerHTML = icon(isFullscreen() ? 'compress' : 'expand');
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, updateFullscreenIcon));
(function initFullscreenBtn() {
  const btn = document.getElementById('fs-btn');
  if (!btn) return;
  if (fsSupported()) updateFullscreenIcon();
  else btn.style.display = 'none';
})();

  }
}

window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').style.display = 'none';
  deferredPrompt = null;
});

// iOS 不触发 beforeinstallprompt，手动显示按钮
(function() {
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const isMobile = /iphone|ipad|ipod|android|mobile/.test(navigator.userAgent.toLowerCase());
  if (isMobile && !isStandalone) {
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (!deferredPrompt) {
          document.getElementById('install-btn').style.display = 'flex';
        }
      }, 500);
    });
  }
})();

/* ===== 版本号展示 + 检查更新 =====
   设置页底部显示当前版本；点击后整页刷新——
   Service Worker 对页面导航是「在线取最新」策略，
   所以在线刷新即可拿到最新部署的版本，版本号会随之变化。 */
(function initVersion() {
  const el = document.getElementById('settings-version');
  if (el) el.innerHTML = 'Little GYM <b>v' + APP_VERSION + '</b><br>点击检查更新';
  // 震动开关初始状态
  const vt = document.getElementById('vibration-toggle');
  if (vt) vt.checked = isVibrationEnabled();
  // 休息步进初始值
  const step = getRestStep();
  const si = document.getElementById('rest-step-input');
  if (si) si.value = step;
  ['rest-step-label', 'rest-step-label2'].forEach(id => {
    const e = document.getElementById(id);
    if (e) e.textContent = step + 's';
  });
  // 准备倒计时开关 + 时长初始值
  const pt = document.getElementById('prepare-toggle');
  if (pt) pt.checked = isPrepareEnabled();
  const psi = document.getElementById('prepare-seconds-input');
  if (psi) psi.value = getPrepareSeconds();
  updatePrepareSecondsRow();
  // 初始化重量/次数滑动选择器
  initPickers();
})();
function checkUpdate() {
  showToast('正在检查更新…');
  setTimeout(() => location.reload(), 500);
}

/* ===== PWA：注册 Service Worker（离线缓存） =====
   浏览器限制：Service Worker 只能在 HTTPS 或 localhost 下注册。
   手机通过局域网 IP（http://192.168.x.x）访问时会被拒绝，
   此时显示提示卡，告知需用 HTTPS 地址打开才能离线使用。 */
function showOfflineHint(bodyHtml) {
  const hint = document.getElementById('offline-hint');
  const body = document.getElementById('offline-hint-body');
  if (!hint || !body) return;
  body.innerHTML = bodyHtml;
  hint.style.display = 'block';
}
function setupServiceWorker() {
  if (!('serviceWorker' in navigator)) {
    showOfflineHint('当前浏览器不支持离线缓存，请用最新版 Safari 或 Chrome 打开。');
    return;
  }
  if (!window.isSecureContext) {
    showOfflineHint(
      '当前是局域网 HTTP 地址，浏览器禁止在此环境下离线缓存。<br>' +
      '解决方法（任选其一）：<br>' +
      '1）把本文件夹拖到 <code>app.netlify.com/drop</code>（免费，免登录），用得到的 HTTPS 链接在手机打开；<br>' +
      '2）电脑运行 <code>cloudflared tunnel --url http://localhost:8000</code>，用输出的 HTTPS 链接在手机打开。<br>' +
      '打开后再「添加到主屏幕」，即可完全离线使用。'
    );
    return;
  }
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .catch(() => showOfflineHint('离线缓存注册失败，请刷新页面重试；若仍失败请用 HTTPS 地址访问。'));
  });
}
setupServiceWorker();
</script>
