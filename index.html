<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little GYM">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>组间训练计时器</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2334C759'/%3E%3Ctext x='90' y='125' font-size='90' text-anchor='middle' fill='white' font-family='Arial'%3E💪%3C/text%3E%3C/svg%3E">
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    margin: 0;
    padding: 0;
  }

  /* ===== 手机框架（默认移动端全屏） ===== */
  .phone {
    width: 100vw;
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100); /* JS 实时修正：兼容移动浏览器地址栏 */
    height: 100dvh;
    background: #ffffff;
    border-radius: 0;
    border: none;
    box-shadow: none;
    overflow: hidden;
    position: relative;
  }
  .phone::before { display: none; }
  .screen {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    overscroll-behavior: none;
  }

  /* ===== 桌面端：显示手机模拟框架 ===== */
  @media (min-width: 481px) and (pointer: fine) {
    body { background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%); padding: 20px; }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 44px;
      border: 10px solid #d2d2d7;
      box-shadow: 0 30px 80px rgba(0,0,0,0.12), 0 0 0 2px #ffffff;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 140px; height: 28px;
      background: #000;
      border-radius: 0 0 18px 18px;
      z-index: 100;
    }
    .screen { padding-top: 36px; }
  }
  /* 平板/手机（触屏）：全屏并锁死根滚动，滑动只发生在应用内部，不触发浏览器地址栏收起 */
  @media (pointer: coarse) {
    html, body { height: 100%; overflow: hidden; }
    body { background: #ffffff !important; padding: 0 !important; min-height: 0 !important; }
    .phone {
      width: 100vw !important;
      height: calc(var(--vh, 1vh) * 100) !important;
      height: 100dvh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .phone::before { display: none !important; }
    .screen { padding-top: env(safe-area-inset-top) !important; }
  }

  /* ===== 通用（app-shell：视图固定一屏，头部不动，内容区内部滚动；
     滚动体不与视口边缘齐平，不会被浏览器提升为根滚动器，地址栏不收起） ===== */
  .view { display: none; }
  .view.active {
    display: flex; flex-direction: column;
    position: absolute; inset: 0;
    overflow: hidden; background: #ffffff;
  }
  .view-head { flex-shrink: 0; }
  .view-head .container { padding-bottom: 0; }
  .view-body {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .view-body::-webkit-scrollbar { width: 0; }
  .view-body .container { padding-top: 0; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  .container { padding: 20px 16px 40px; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 20px;
  }
  .title { font-size: 26px; font-weight: 700; color: #1d1d1f; white-space: nowrap; }
  .header { gap: 8px; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    font-size: 20px; line-height: 1;
    padding: 8px 8px;
    background: #f5f5f7;
    border: none;
    border-radius: 10px;
    color: #86868b;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .icon-btn:active { transform: scale(0.92); }
  /* 窄屏：标题与按钮再压缩，保证单行 */
  @media (max-width: 360px) {
    .title { font-size: 22px; }
    .header-actions { gap: 6px; }
    .icon-btn { font-size: 19px; padding: 7px 8px; }
  }
  @media (max-width: 340px) {
    .title { font-size: 20px; }
    .header-actions { gap: 4px; }
    .icon-btn { font-size: 18px; padding: 6px 6px; }
  }

  /* ===== 内联 SVG 图标（随字号缩放，零外链） ===== */
  svg.ic {
    width: 1em; height: 1em;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.15em;
    flex-shrink: 0;
  }

  /* ===== 历史页 - 月历看板 ===== */
  .calendar-wrap {
    background: #ffffff; border-radius: 16px;
    border: 1px solid #e5e5ea; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .cal-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .cal-month-title { font-size: 17px; font-weight: 600; color: #1d1d1f; }
  .cal-nav-btn {
    background: #f5f5f7; border: 1px solid #e5e5ea; color: #86868b;
    border-radius: 8px; padding: 6px 14px; font-size: 16px; cursor: pointer;
    transition: all 0.15s;
  }
  .cal-nav-btn:active { transform: scale(0.92); }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 8px;
  }
  .cal-weekday {
    text-align: center; font-size: 12px; color: #aeaeb2;
    padding: 4px 0;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 10px; font-size: 15px; color: #86868b;
    background: #f5f5f7; border: 1px solid transparent;
    cursor: pointer; transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .cal-day:active { transform: scale(0.92); }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.today { border-color: #007AFF; color: #007AFF; font-weight: 600; }
  .cal-day.has-training {
    background: linear-gradient(135deg, #34C759, #248a3d);
    color: #fff; font-weight: 600;
  }
  .cal-day.has-training.today { box-shadow: 0 0 0 2px #fff inset; }
  .cal-day.selected { outline: 2px solid #1d1d1f; outline-offset: -2px; }
  .cal-day .cal-day-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,0.7); margin-top: 2px;
  }

  /* 日期详情 */
  .day-detail {
    background: #ffffff; border-radius: 14px; padding: 16px;
    border: 1px solid #e5e5ea; animation: slideUp 0.25s ease-out;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .day-detail-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .day-detail-title { font-size: 16px; font-weight: 600; color: #34C759; }
  .day-detail-summary { font-size: 13px; color: #86868b; }
  .detail-part { margin-bottom: 16px; }
  .detail-part:last-child { margin-bottom: 0; }
  .detail-part-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 14px; font-weight: 600; color: #1d1d1f;
    padding-bottom: 6px; border-bottom: 1px solid #e5e5ea;
    margin-bottom: 8px;
  }
  .detail-del-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border: none; border-radius: 8px;
    background: transparent; color: #ff3b30; cursor: pointer;
    transition: background .15s;
  }
  .detail-del-btn:hover { background: rgba(255,59,48,0.1); }
  .detail-del-btn:active { transform: scale(0.92); }
  .detail-del-btn .ic { width: 18px; height: 18px; }
  .detail-action { margin-bottom: 10px; }
  .detail-action:last-child { margin-bottom: 0; }
  .detail-action-name {
    font-size: 14px; color: #3a3a3c; margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  .detail-sets { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-set {
    background: #f5f5f7; border: 1px solid #e5e5ea;
    border-radius: 8px; padding: 4px 10px; font-size: 12px;
    color: #636366; font-variant-numeric: tabular-nums;
  }
  .detail-set .set-num { color: #34C759; font-weight: 600; }
  .detail-empty { text-align: center; color: #c7c7cc; padding: 20px 0; font-size: 13px; }

  /* ===== 首页 - 部位卡片 ===== */
  .part-list { display: flex; flex-direction: column; gap: 14px; }
  .part-card {
    background: #ffffff; border-radius: 16px;
    border: 1px solid #e5e5ea; overflow: hidden;
    transition: all 0.2s;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .part-card:active { transform: scale(0.98); }
  .part-head {
    display: flex; align-items: center; padding: 16px 18px;
    cursor: pointer; gap: 14px;
  }
  .part-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #34C759, #248a3d);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .part-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .part-name { font-size: 18px; font-weight: 600; color: #1d1d1f; }
  .part-count { font-size: 13px; color: #86868b; }
  .part-arrow { font-size: 16px; color: #34C759; transition: transform 0.2s; }
  .part-card.expanded .part-arrow { transform: rotate(90deg); }
  .part-actions {
    display: none; padding: 0 18px 14px;
    flex-direction: column; gap: 8px;
  }
  .part-card.expanded .part-actions { display: flex; }
  .part-action-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #f5f5f7; border-radius: 10px; padding: 10px 14px;
  }
  .part-action-name { font-size: 14px; color: #3a3a3c; }
  .part-action-defaults { font-size: 12px; color: #aeaeb2; }
  .part-start-btn {
    width: calc(100% - 36px); margin: 8px 18px 16px;
    padding: 12px 0; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #34C759, #248a3d);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s;
  }
  .part-start-btn:active { transform: scale(0.97); }
  .footer { text-align: center; padding-top: 30px; }
  .footer-text { color: #d1d1d6; font-size: 13px; }
  .install-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; margin-bottom: 12px;
    background: linear-gradient(135deg, #34C759, #248a3d);
    color: #fff; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s;
  }
  .install-btn:active { transform: scale(0.96); }
  /* 离线不可用提示卡（HTTP 局域网访问时显示） */
  .offline-hint {
    text-align: left;
    background: #fff8f0;
    border: 1px solid #ffe0b2;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .offline-hint-title { font-size: 14px; font-weight: 700; color: #b25000; margin-bottom: 6px; }
  .offline-hint-body { font-size: 13px; color: #8a5a2a; line-height: 1.7; }
  .offline-hint-body code {
    background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px;
    font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  /* ===== 训练板块（内含「启动页 hub」与「计时页 session」两个子态） ===== */
  /* 底部为标签栏留出空间（标签栏高 ≈ 64 + 底部安全区/24px，另留 6px 呼吸） */
  #view-training.active {
    padding-bottom: calc(70px + max(24px, env(safe-area-inset-bottom, 0px)));
  }
  /* 启动页：可滚动列表 */
  .training-hub {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .training-hub .container { padding-bottom: 12px; }
  /* 计时页：固定不滚动 */
  .training-container {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding-bottom: 0;
    position: relative;
  }
  /* 训练页空状态 */
  .session-empty {
    position: absolute; inset: 0; z-index: 5;
    background: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .session-empty-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, #34C759, #248a3d);
    display: flex; align-items: center; justify-content: center;
    color: #fff; margin-bottom: 20px;
  }
  .session-empty-icon .ic { width: 36px; height: 36px; }
  .session-empty-title { font-size: 20px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
  .session-empty-sub { font-size: 14px; color: #86868b; margin-bottom: 24px; }
  .session-empty-btn {
    padding: 12px 28px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #34C759, #248a3d); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .session-empty-btn:active { transform: scale(0.96); }

  /* 启动页：进行中训练卡片 */
  .ongoing-card {
    background: linear-gradient(135deg, #34C759, #248a3d);
    border-radius: 16px; padding: 18px; color: #fff;
    margin-bottom: 18px;
    box-shadow: 0 8px 20px rgba(52,199,89,0.25);
  }
  .ongoing-title { font-size: 13px; font-weight: 600; opacity: 0.9; }
  .ongoing-main { font-size: 19px; font-weight: 700; margin: 6px 0 2px; }
  .ongoing-status { font-size: 14px; opacity: 0.92; font-variant-numeric: tabular-nums; }
  .ongoing-actions { display: flex; gap: 10px; margin-top: 14px; }
  .ongoing-btn {
    flex: 1; padding: 11px 0; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform 0.15s;
  }
  .ongoing-btn:active { transform: scale(0.97); }
  .ongoing-resume { background: #ffffff; color: #248a3d; }
  .ongoing-end { background: rgba(255,255,255,0.22); color: #ffffff; }

  /* 启动页：部位开始行 */
  .hub-list { display: flex; flex-direction: column; gap: 10px; }
  .hub-part {
    display: flex; align-items: center; gap: 12px;
    width: 100%; background: #ffffff;
    border: 1px solid #e5e5ea; border-radius: 14px;
    padding: 14px 16px; cursor: pointer; text-align: left;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    transition: transform 0.15s;
  }
  .hub-part:active { transform: scale(0.98); }
  .hub-part-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hub-part-name { font-size: 16px; font-weight: 600; color: #1d1d1f; }
  .hub-part-count { font-size: 12px; color: #86868b; }
  .hub-part-go {
    background: #e8f5e9; color: #34C759; border: none; border-radius: 16px;
    padding: 7px 18px; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .hub-empty {
    text-align: center; color: #86868b; font-size: 15px;
    padding: 70px 20px; line-height: 1.7;
  }
  .hub-empty-sub { font-size: 13px; color: #aeaeb2; margin-top: 6px; }
  /* 计时页顶部信息条：部位 + 动作 + 组数（单行精简） */
  .session-info {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 2px 12px; flex-shrink: 0;
  }
  .si-part {
    font-size: 12px; font-weight: 600; color: #34C759;
    background: #e8f5e9; padding: 4px 12px; border-radius: 12px;
    flex-shrink: 0;
  }
  .si-name {
    flex: 1; min-width: 0;
    font-size: clamp(16px, 4.6vw, 19px); font-weight: 700; color: #1d1d1f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .si-group {
    font-size: 12px; color: #86868b; background: #f5f5f7;
    padding: 4px 12px; border-radius: 12px; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .adjust-area { display: flex; justify-content: space-around; padding: 16px 0 12px; gap: 16px; flex-shrink: 0; }
  .adjust-item { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
  .adjust-label { font-size: 14px; color: #86868b; margin-bottom: 8px; }
  /* 左右滑动选择器 */
  .slide-picker {
    position: relative; width: 100%; height: clamp(52px, 15vw, 68px);
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .slide-track {
    display: flex; align-items: center; height: 100%;
    will-change: transform;
  }
  .slide-track.animating { transition: transform 0.28s cubic-bezier(0.25, 0.8, 0.3, 1); }
  .slide-num {
    flex: 0 0 33.333%; text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: clamp(24px, 7.5vw, 32px); font-weight: 700; color: #1d1d1f;
    transition: opacity 0.2s, font-size 0.2s;
  }
  .slide-num.slide-prev, .slide-num.slide-next { opacity: 0.3; font-size: clamp(18px, 5.5vw, 24px); font-weight: 500; }
  .slide-num.slide-cur { opacity: 1; }
  .slide-picker::before, .slide-picker::after {
    /* 左右渐隐遮罩，强化预览感 */
    content: ''; position: absolute; top: 0; bottom: 0; width: 24px; pointer-events: none; z-index: 1;
  }
  .slide-picker::before { left: 0; background: linear-gradient(90deg, #fff 10%, transparent); }
  .slide-picker::after { right: 0; background: linear-gradient(270deg, #fff 10%, transparent); }
  .num-unit { font-size: 13px; color: #aeaeb2; margin-top: 4px; }

  .record-btn {
    width: 100%; padding: 16px 0; border-radius: 16px;
    background: linear-gradient(135deg, #34C759, #248a3d);
    border: none; margin: 4px 0 8px; cursor: pointer;
    transition: all 0.2s; flex-shrink: 0;
  }
  .record-btn:active { transform: scale(0.97); }
  .record-btn:disabled { background: #e5e5ea; opacity: 0.6; cursor: not-allowed; }
  .record-btn-text { font-size: 18px; font-weight: 600; color: #fff; }

  .timer-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #f5f5f7; border-radius: 20px; margin: 4px 0 8px;
    flex: 1 1 auto; min-height: 88px; position: relative; border: 1px solid #e5e5ea;
    cursor: pointer; overflow: hidden;
  }
  .timer-display { padding: clamp(2px, 1.2vh, 10px) 0; }
  .timer-number {
    font-size: clamp(40px, 11vw, 72px); font-weight: 700; color: #34C759;
    font-variant-numeric: tabular-nums; letter-spacing: 2px;
    line-height: 1.1;
  }
  .timer-status { margin-top: 4px; }
  .timer-label { font-size: clamp(14px, 2.6vh, 18px); color: #86868b; }
  .timer-hint { font-size: 12px; color: #d1d1d6; margin-top: 8px; }
  /* 休息时长调节键 */
  .rest-adjust {
    display: flex; justify-content: center; gap: 16px;
    margin: 2px 0 6px; flex-shrink: 0;
  }
  .rest-adj-btn {
    display: inline-flex; align-items: baseline; gap: 2px;
    padding: 8px 16px; border-radius: 20px; border: 1px solid #e5e5ea;
    background: #fff; color: #1d1d1f; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: transform 0.12s, background 0.12s;
  }
  .rest-adj-btn span { font-size: 12px; font-weight: 500; color: #86868b; }
  .rest-adj-btn.plus { color: #34C759; }
  .rest-adj-btn:active { transform: scale(0.92); background: #f0f0f2; }
  .timer-sub {
    font-size: 13px; color: #86868b; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .timer-sub span { color: #34C759; font-weight: 600; }
  /* 15秒震动提醒 */
  .shake-alert { animation: shake 0.5s ease-in-out 3; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .timer-area.warning { border-color: #FF9500; background: #fff8f0; }
  .timer-area.warning .timer-number { color: #FF9500; }

  .ready-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(245,245,247,0.88); border-radius: 20px;
  }
  .ready-number {
    font-size: clamp(64px, 20vw, 110px); font-weight: 800; color: #34C759;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.7; }
  }
  .rest-finished-pulse { animation: finishedPulse 0.6s ease-out; }
  @keyframes finishedPulse {
    0% { box-shadow: 0 0 0 0 rgba(52,199,89,0.6); }
    100% { box-shadow: 0 0 0 30px rgba(52,199,89,0); }
  }

  .bottom-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 8px; flex-shrink: 0; }
  .nav-btn {
    flex: 1; padding: 12px 0; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 500; cursor: pointer;
    background: #f0f0f2; color: #636366; transition: all 0.15s;
  }
  .nav-btn:active { transform: scale(0.95); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .next-btn { background: #e8f5e9; color: #34C759; }
  .end-btn { background: #fff0f0; color: #ff3b30; }

  /* 矮屏设备（如 iPhone SE 568px 高）：压缩计时页各区，保证底部按钮不被挤出 */
  @media (max-height: 640px) {
    .session-info { padding: 2px 2px 6px; }
    .si-part, .si-group { padding: 2px 9px; }
    .si-name { font-size: 15px; }
    .adjust-area { padding: 6px 0 4px; gap: 10px; }
    .adjust-label { margin-bottom: 4px; font-size: 12px; }
    .num-btn { width: clamp(30px, 9vw, 36px); height: clamp(30px, 9vw, 36px); font-size: 18px; }
    .num-display { font-size: clamp(22px, 7vw, 26px); }
    .num-unit { margin-top: 2px; font-size: 12px; }
    .record-btn { padding: 10px 0; margin: 2px 0 4px; border-radius: 14px; }
    .record-btn-text { font-size: 16px; }
    .timer-area { min-height: 48px; margin: 2px 0 4px; border-radius: 16px; }
    .timer-number { font-size: clamp(32px, 9vw, 52px); }
    .timer-hint { display: none; }
    .timer-label { font-size: 13px; }
    .bottom-actions { padding-top: 4px; }
    .nav-btn { padding: 9px 0; font-size: 13px; }
  }

  /* ===== 设置页：手风琴 + 拖拽 ===== */
  .add-btn {
    background: #34C759; color: #fff; border: none;
    border-radius: 20px; padding: 8px 20px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: transform 0.15s;
  }
  .add-btn:active { transform: scale(0.92); }
  .settings-list { display: flex; flex-direction: column; gap: 10px; }
  /* 版本号（设置页底部，点击检查更新） */
  .settings-version {
    text-align: center; color: #c7c7cc; font-size: 12px;
    padding: 28px 0 10px; cursor: pointer; user-select: none;
    line-height: 1.6;
  }
  .settings-version:active { color: #86868b; }
  /* 设置项卡片（开关行） */
  .settings-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .option-row {
    background: #ffffff; border: 1px solid #e5e5ea; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  }
  .option-info { flex: 1; min-width: 0; }
  .option-title { font-size: 16px; font-weight: 600; color: #1d1d1f; display: flex; align-items: center; gap: 7px; }
  .option-title i { color: #34C759; font-size: 17px; }
  .option-sub { font-size: 12px; color: #86868b; margin-top: 3px; line-height: 1.5; }
  /* iOS 风开关 */
  .switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch-slider {
    position: absolute; inset: 0; background: #e5e5ea; border-radius: 30px;
    transition: background 0.22s; pointer-events: none;
  }
  .switch-slider::before {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 26px; height: 26px; background: #fff; border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.22); transition: transform 0.22s cubic-bezier(0.3, 0.9, 0.4, 1.2);
  }
  .switch input:checked + .switch-slider { background: #34C759; }
  .switch input:checked + .switch-slider::before { transform: translateX(20px); }
  /* 步进调节器 */
  .step-control { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .step-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: #f0f0f2; color: #1d1d1f; font-size: 20px; font-weight: 300;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .step-btn:active { transform: scale(0.9); background: #e5e5ea; }
  .step-input {
    width: 52px; text-align: center; font-size: 16px; font-weight: 700;
    padding: 6px 0; border: 1px solid #e5e5ea; border-radius: 8px; background: #f5f5f7;
    -moz-appearance: textfield; appearance: textfield;
  }
  .step-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .step-unit { font-size: 14px; color: #86868b; }

  .part-section {
    background: #ffffff; border-radius: 14px; overflow: hidden;
    border: 1px solid #e5e5ea;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .part-swipe-wrap { position: relative; overflow: hidden; }
  .part-swipe-delete {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 80px; background: #ff3b30; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
  }
  .part-section-head {
    transition: transform 0.28s cubic-bezier(0.25, 0.8, 0.3, 1);
    background: #ffffff; position: relative; z-index: 1;
    display: flex; align-items: center; padding: 14px 16px;
    cursor: pointer; gap: 12px; user-select: none;
    touch-action: pan-y; /* 纵向滚动交给浏览器，横向由 JS 接管 */
    will-change: transform;
  }
  .part-section-head.swipe-open { transform: translate3d(-80px, 0, 0); }
  .part-section-head.swipe-drag { transition: none; }
  .part-section-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #34C759, #248a3d);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .part-section-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .part-section-name { font-size: 16px; font-weight: 600; color: #1d1d1f; }
  .part-section-count { font-size: 12px; color: #86868b; }
  .part-section-arrow { font-size: 14px; color: #34C759; transition: transform 0.2s; }
  .part-section.expanded .part-section-arrow { transform: rotate(90deg); }
  .part-section-body {
    display: none; padding: 4px 12px 12px;
    flex-direction: column; gap: 6px;
  }
  .part-section.expanded .part-section-body { display: flex; }

  .action-row {
    display: flex; align-items: center; gap: 10px;
    background: #f5f5f7; border-radius: 10px; padding: 10px 12px;
    border: 1px solid #e5e5ea;
    transition: opacity 0.2s, border-color 0.2s;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .action-row.dragging { opacity: 0.4; }
  .action-row.drag-over-top { border-top: 2px solid #34C759; }
  .action-row.drag-over-bottom { border-bottom: 2px solid #34C759; }

  .drag-handle {
    cursor: grab; color: #c7c7cc; font-size: 16px;
    padding: 2px 4px; user-select: none;
    display: flex; align-items: center; flex-shrink: 0;
    touch-action: none; /* 移动端拖拽把手接管手势 */
  }
  .drag-handle:active { cursor: grabbing; color: #86868b; }
  .part-drag-handle { cursor: grab; opacity: 0.4; transition: opacity 0.15s; }
  .part-drag-handle:hover { opacity: 1; }
  .action-row.dragging { opacity: 0.5; z-index: 10; position: relative; }
  .part-section.dragging { opacity: 0.6; z-index: 10; position: relative; }
  .part-section-head.dragging { opacity: 0.4; }
  .part-section-head.part-drag-over { border-top: 3px solid #34C759; margin-top: -3px; }

  .action-row-info { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .action-row-name {
    font-size: 15px; font-weight: 500; color: #1d1d1f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .action-row-detail { font-size: 12px; color: #86868b; }
  .action-row-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .mini-btn {
    background: transparent; border: none; font-size: 16px;
    padding: 6px 8px; cursor: pointer; transition: transform 0.15s;
  }
  .mini-btn:active { transform: scale(0.85); }

  .drag-hint {
    font-size: 11px; color: #d1d1d6; text-align: center;
    padding: 6px 0 2px;
  }

  /* ===== 历史页 ===== */
  .clear-btn {
    background: #fff0f0; color: #ff3b30; border: none;
    border-radius: 16px; padding: 6px 16px; font-size: 13px;
    cursor: pointer; transition: transform 0.15s;
  }
  .clear-btn:active { transform: scale(0.92); }
  .record-list { display: flex; flex-direction: column; gap: 14px; }
  .record-card {
    background: #ffffff; border-radius: 14px; padding: 16px 18px;
    border: 1px solid #e5e5ea;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .record-date {
    font-size: 16px; font-weight: 600; color: #34C759;
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #e5e5ea;
  }
  .record-part { font-size: 13px; color: #86868b; margin-bottom: 6px; }
  .record-action { display: flex; justify-content: space-between; padding: 4px 0; gap: 8px; }
  .record-action-name { font-size: 15px; color: #1d1d1f; font-weight: 500; }
  .record-action-groups { font-size: 13px; color: #86868b; text-align: right; }
  .record-action-detail {
    display: inline-block; background: #f5f5f7; padding: 1px 8px;
    border-radius: 4px; margin-left: 4px; color: #636366; font-size: 12px;
  }
  .record-total {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid #e5e5ea;
    font-size: 13px; color: #aeaeb2; text-align: right;
  }
  .empty-wrap { text-align: center; color: #86868b; padding: 60px 0; display: flex; flex-direction: column; gap: 8px; }
  .sub-tip { font-size: 14px; color: #d1d1d6; }

  /* ===== 弹窗 ===== */
  .modal-mask {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); display: flex;
    align-items: center; justify-content: center; z-index: 200;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-content {
    background: #ffffff; border-radius: 20px; padding: 24px 20px;
    width: 88%; max-height: 80%; overflow-y: auto;
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title {
    font-size: 20px; font-weight: 700; color: #1d1d1f;
    display: block; margin-bottom: 20px; text-align: center;
  }
  .form-group { margin-bottom: 14px; }
  .form-row { display: flex; gap: 12px; }
  .form-group.half { flex: 1; }

  /* 每组重量次数配置 */
  .sets-config-list { display: flex; flex-direction: column; gap: 8px; }
  .set-config-row {
    display: flex; align-items: center; gap: 8px;
    background: #f5f5f7; border-radius: 10px; padding: 8px 10px;
  }
  .set-config-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: #34C759; color: #fff; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .set-config-inputs { flex: 1; display: flex; gap: 8px; align-items: center; }
  .set-config-inputs input {
    flex: 1; width: 100%; padding: 6px 8px; border-radius: 6px;
    background: #fff; border: 1px solid #e5e5ea; color: #1d1d1f;
    font-size: 14px; text-align: center; outline: none;
    font-variant-numeric: tabular-nums;
  }
  .set-config-inputs input:focus { border-color: #34C759; }
  .set-config-inputs label { font-size: 11px; color: #aeaeb2; min-width: 16px; }
  .form-label { font-size: 13px; color: #86868b; display: block; margin-bottom: 4px; }
  .form-input, .form-select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: #f5f5f7; border: 1px solid #e5e5ea; color: #1d1d1f;
    font-size: 16px; outline: none;
  }
  .form-input:focus, .form-select:focus { border-color: #34C759; }
  .form-select option { background: #ffffff; color: #1d1d1f; }
  .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
  .modal-btn {
    flex: 1; padding: 12px 0; border-radius: 10px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.15s;
  }
  .modal-btn:active { transform: scale(0.95); }
  .modal-cancel { background: #e5e5ea; color: #86868b; }
  .modal-confirm { background: #34C759; color: #fff; }

  /* ===== 全局 Toast ===== */
  .toast {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(29,29,31,0.95); color: #fff;
    padding: 12px 24px; border-radius: 12px; font-size: 14px;
    z-index: 300; animation: toastIn 0.25s ease-out;
    border: 1px solid #d2d2d7;
  }
  @keyframes toastIn { from { transform: translateX(-50%) translateY(-10px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

  /* ===== 确认弹窗 ===== */
  .confirm-content { text-align: center; }
  .confirm-text { font-size: 16px; color: #3a3a3c; margin-bottom: 20px; line-height: 1.5; }

  /* ===== 标签栏 ===== */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #ffffff; border-top: 1px solid #e5e5ea;
    display: flex; padding: 8px 0 max(24px, env(safe-area-inset-bottom, 0px)); z-index: 90;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 2px; cursor: pointer; padding: 6px 0;
    background: none; border: none; color: #aeaeb2; transition: color 0.2s;
  }
  .tab-item.active { color: #34C759; }
  .tab-icon { font-size: 22px; }
  .tab-label { font-size: 11px; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen">

    <!-- ============ 首页：部位选择 ============ -->
    <div class="view active" id="view-home">
      <div class="view-head">
        <div class="container">
          <div class="header">
            <div class="title">今天练什么？</div>
            <div class="header-actions">
              <button class="icon-btn" id="fs-btn" onclick="toggleFullscreen()" title="全屏"><i data-ic="expand"></i></button>
              <button class="icon-btn" onclick="showQRCode()"><i data-ic="qr"></i></button>
              <button class="icon-btn" onclick="switchView('history')"><i data-ic="chart"></i></button>
              <button class="icon-btn" onclick="switchView('settings')"><i data-ic="gear"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="view-body">
        <div class="container">
          <div class="part-list" id="part-list"></div>

          <div class="footer">
            <button class="install-btn" id="install-btn" style="display:none" onclick="installApp()">
              <i data-ic="plus"></i> 添加到主屏幕
            </button>
            <div class="offline-hint" id="offline-hint" style="display:none">
              <div class="offline-hint-title" id="offline-hint-title">离线功能未启用</div>
              <div class="offline-hint-body" id="offline-hint-body"></div>
            </div>
            <div class="footer-text"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ 训练板块 ============ -->
    <div class="view" id="view-training">

      <!-- 计时页（信息条 + 重量次数调节 + 计时 + 动作切换） -->
      <div class="container training-container" id="training-session">
        <!-- 无进行中训练时的空状态 -->
        <div class="session-empty" id="session-empty" style="display:none">
          <div class="session-empty-icon"><i data-ic="dumbbell"></i></div>
          <div class="session-empty-title">快开始今天的训练吧！</div>
          <div class="session-empty-sub">去首页选择一个部位开始计时</div>
          <button class="session-empty-btn" onclick="switchView('home')">去首页</button>
        </div>

        <div class="session-info">
          <span class="si-part" id="tr-si-part">胸部</span>
          <span class="si-name" id="tr-si-name">-</span>
          <span class="si-group" id="tr-si-groups">0/3 组</span>
        </div>

        <div class="adjust-area">
          <div class="adjust-item">
            <div class="adjust-label"><i data-ic="weight"></i> 重量</div>
            <div class="slide-picker" id="picker-weight" data-field="weight" data-step="2.5" data-min="0" data-max="500">
              <div class="slide-track">
                <span class="slide-num slide-prev"></span>
                <span class="slide-num slide-cur"></span>
                <span class="slide-num slide-next"></span>
              </div>
            </div>
            <div class="num-unit">kg</div>
          </div>
          <div class="adjust-item">
            <div class="adjust-label"><i data-ic="hash"></i> 次数</div>
            <div class="slide-picker" id="picker-reps" data-field="reps" data-step="1" data-min="0" data-max="99">
              <div class="slide-track">
                <span class="slide-num slide-prev"></span>
                <span class="slide-num slide-cur"></span>
                <span class="slide-num slide-next"></span>
              </div>
            </div>
            <div class="num-unit">次</div>
          </div>
        </div>

        <button class="record-btn" id="tr-record-btn" onclick="toggleTraining()">
          <span class="record-btn-text" id="tr-record-btn-text"><i data-ic="play"></i> 开始计时</span>
        </button>

        <div class="timer-area" id="tr-timer" onclick="skipRest()">
          <div class="timer-display"><span class="timer-number" id="tr-timer-num">00:00</span></div>
          <div class="timer-status"><span class="timer-label" id="tr-timer-label">准备开始第一组</span></div>
          <div class="timer-hint" id="tr-timer-hint" style="display:none">点击跳过休息</div>
        </div>

        <!-- 休息时长调节（仅休息阶段显示） -->
        <div class="rest-adjust" id="rest-adjust" style="display:none">
          <button class="rest-adj-btn" onclick="adjustRestTime(-getRestStep())">−<span id="rest-step-label">15s</span></button>
          <button class="rest-adj-btn plus" onclick="adjustRestTime(getRestStep())">+<span id="rest-step-label2">15s</span></button>
        </div>

        <div class="bottom-actions">
          <button class="nav-btn" id="tr-prev" onclick="prevAction()"><i data-ic="step-back"></i> 上个</button>
          <button class="nav-btn next-btn" id="tr-next" onclick="nextAction()">下个 <i data-ic="step-forward"></i></button>
          <button class="nav-btn end-btn" onclick="endTraining()"><i data-ic="flag"></i> 结束</button>
        </div>
      </div>
    </div>

    <!-- ============ 设置页 ============ -->
    <div class="view" id="view-settings">
      <div class="view-head">
        <div class="container">
          <div class="header">
            <div class="title"><i data-ic="gear"></i> 动作管理</div>
            <button class="add-btn" onclick="openAddModal()"><i data-ic="plus"></i> 添加</button>
          </div>
        </div>
      </div>
      <div class="view-body">
        <div class="container">
          <div class="settings-options">
            <div class="option-row">
              <div class="option-info">
                <div class="option-title"><i data-ic="vibrate"></i> 震动提醒</div>
                <div class="option-sub">准备倒计时最后 3 秒、休息结束时震动（iPhone 不支持网页震动）</div>
              </div>
              <label class="switch">
                <input type="checkbox" id="vibration-toggle" onchange="setVibrationEnabled(this.checked)">
                <span class="switch-slider"></span>
              </label>
            </div>
            <div class="option-row">
              <div class="option-info">
                <div class="option-title"><i data-ic="clock"></i> 准备倒计时</div>
                <div class="option-sub">训练开始前的准备倒计时，关闭后点击开始直接计时</div>
              </div>
              <label class="switch">
                <input type="checkbox" id="prepare-toggle" onchange="setPrepareEnabled(this.checked)">
                <span class="switch-slider"></span>
              </label>
            </div>
            <div class="option-row" id="prepare-seconds-row">
              <div class="option-info">
                <div class="option-title">准备倒计时时长</div>
                <div class="option-sub">每组训练开始前的准备秒数</div>
              </div>
              <div class="step-control">

function icon(name) {

}
// 替换静态 HTML 中的图标占位（<i data-ic="name">）

  el.outerHTML = icon(el.getAttribute('data-ic'));
});

/* ============================================================
   部位定义（预定义，可扩展）
   ============================================================ */
const BODY_PARTS = [
  { name: '胸部', icon: 'chest' },
  { name: '背部', icon: 'back' },
  { name: '腿部', icon: 'legs' },
  { name: '肩部', icon: 'shoulder' },
  { name: '手臂', icon: 'arms' },
  { name: '核心', icon: 'core' },
  { name: '未分类', icon: 'box' }
];

function getPartIcon(name) {
  const p = BODY_PARTS.find(b => b.name === name);
  return p ? p.icon : 'box';
}

/* 部位顺序持久化 */
const PART_ORDER_KEY = 'part_order_v1';
function getPartOrder() {
  try {
    const stored = JSON.parse(localStorage.getItem(PART_ORDER_KEY));
    if (stored && Array.isArray(stored)) return stored;
  } catch(e) {}
  // 默认按 BODY_PARTS 顺序
  return BODY_PARTS.map(p => p.name);
}
function savePartOrder(order) {
  localStorage.setItem(PART_ORDER_KEY, JSON.stringify(order));
}
/* 获取按存储顺序排列的部位（含图标），未存储的追加到末尾 */
function getOrderedParts() {
  const order = getPartOrder();
  const result = [];
  const used = new Set();
  order.forEach(name => {
    const p = BODY_PARTS.find(b => b.name === name);
    if (p) { result.push(p); used.add(name); }
  });
  BODY_PARTS.forEach(p => {
    if (!used.has(p.name)) result.push(p);
  });
  return result;
}

/* ============================================================
   应用版本
   ⚠️ 每次部署前必须 +1（与 sw.js 顶部的 APP_VERSION 保持一致），
   设置页底部展示该版本号，用于确认手机上是否已是最新版。
   规则：新功能/界面改动升次版本(1.1→1.2)，修复升修订号(1.1.0→1.1.1)
   ============================================================ */
const APP_VERSION = '1.9.0';

/* ============================================================
   数据层
   ============================================================ */
const ACTIONS_KEY_V3 = 'training_actions_v3';
const ACTIONS_KEY_V2 = 'training_actions_v2';
const ACTIONS_KEY_V1 = 'training_actions_v1';
const RECORDS_KEY = 'training_records_v1';
const VIBRATION_KEY = 'gym_vibration_enabled'; // 震动开关（默认开）
const REST_STEP_KEY = 'gym_rest_step';          // 休息时长调节步进（秒，默认15）
const PREPARE_ENABLED_KEY = 'gym_prepare_enabled'; // 准备倒计时开关（默认开）
const PREPARE_SECONDS_KEY = 'gym_prepare_seconds'; // 准备倒计时秒数（默认15）

function getRestStep() {
  const v = parseInt(localStorage.getItem(REST_STEP_KEY), 10);
  return (v && v > 0) ? v : 15;
}
function setRestStep(sec) {
  sec = Math.max(1, Math.min(300, parseInt(sec, 10) || 15));
  localStorage.setItem(REST_STEP_KEY, String(sec));
  // 同步设置页输入框 + 计时页按钮标签
  const si = document.getElementById('rest-step-input');
  if (si) si.value = sec;
  ['rest-step-label', 'rest-step-label2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = sec + 's';
  });
}
/* 调节当前休息时长（仅 resting 阶段生效） */
function adjustRestTime(delta) {
  if (training.phase !== 'resting') return;
  let r = training.restSeconds + delta;
  if (r < 1) r = 1;
  training.restSeconds = r;
  // 同步更新休息总时长，使回填的 restDuration 反映调节后的值
  training.restDurationTotal = Math.max(1, (training.restDurationTotal || 0) + delta);
  training.timerDisplay = formatTime(r);
  updateTrainingUI();
}

function getActions() {
  try { return JSON.parse(localStorage.getItem(ACTIONS_KEY_V3)) || []; }
  catch(e) { return []; }
}
function saveActions(actions) {
  localStorage.setItem(ACTIONS_KEY_V3, JSON.stringify(actions));
}
function addAction(action) {
  const actions = getActions();
  action.id = Date.now().toString();
  // 新动作放到该部位末尾
  const samePart = actions.filter(a => a.bodyPart === action.bodyPart);
  action.order = samePart.length;
  actions.push(action);
  saveActions(actions);
}
function updateAction(id, newData) {
  const actions = getActions();
  const idx = actions.findIndex(a => a.id === id);
  if (idx === -1) return;
  const oldPart = actions[idx].bodyPart;
  // 如果改了部位，把 order 设到新部位末尾
  if (newData.bodyPart && newData.bodyPart !== oldPart) {
    const samePartCount = actions.filter(a => a.bodyPart === newData.bodyPart && a.id !== id).length;
    newData.order = samePartCount;
    actions[idx] = { ...actions[idx], ...newData };
    // 重排旧部位剩余动作的 order，避免出现空隙
    actions.filter(a => a.bodyPart === oldPart).forEach((a, i) => a.order = i);
  } else {
    actions[idx] = { ...actions[idx], ...newData };
  }
  saveActions(actions);
}
function deleteAction(id) {
  const actions = getActions().filter(a => a.id !== id);
  // 重排受影响部位的 order
  const affectedParts = new Set();
  actions.forEach(a => affectedParts.add(a.bodyPart));
  affectedParts.forEach(part => {
    const partActions = actions.filter(a => a.bodyPart === part);
    partActions.forEach((a, i) => a.order = i);
  });
  saveActions(actions);
}
function getActionsByPart(part) {
  return getActions()
    .filter(a => a.bodyPart === part)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}

function getRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; }
  catch(e) { return []; }
}
function saveRecord(record) {
  const records = getRecords();
  records.push({
    id: Date.now().toString(),
    date: new Date().toLocaleString('zh-CN'),
    dateKey: formatDateKey(new Date()),
    ...record
  });
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
}
function clearRecords() {
  localStorage.setItem(RECORDS_KEY, '[]');
}
/* 删除指定 id 的训练记录（单条部位训练） */
function deleteRecord(id) {
  const records = getRecords().filter(r => r.id !== id);
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
}
/* 批量删除指定 id 列表的记录 */
function deleteRecordsByIds(ids) {
  const set = new Set(ids);
  const records = getRecords().filter(r => !set.has(r.id));
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
}

/* 健壮的记录日期解析：兼容 toLocaleString 各种格式 */
function parseRecordDate(record) {
  // 优先使用已存储的 dateKey
  if (record.dateKey) return record.dateKey;
  const raw = record.date || '';
  // 尝试 Date 解析
  const dt = new Date(raw);
  if (!isNaN(dt.getTime())) {
    return formatDateKey(dt);
  }
  // 手动解析 "2026/9/5" 或 "2026-9-5" 等
  const match = raw.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (match) {
    return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
  }
  return null;
}

/* 扫描所有记录，返回已训练日期集合（YYYY-MM-DD） */
function getTrainingDates() {
  const records = getRecords();
  const dates = new Set();
  records.forEach(r => {
    const key = parseRecordDate(r);
    if (key) dates.add(key);
  });
  return dates;
}

function formatDateKey(d) {
  const y = d.getFullYear();
  const m = (d.getMonth() + 1).toString().padStart(2, '0');
  const day = d.getDate().toString().padStart(2, '0');
  return `${y}-${m}-${day}`;
}

/* 聚合某日的训练记录，返回嵌套结构：部位 → 动作 → 每组顺序 */
function getRecordsByDate(dateKey) {
  const records = getRecords();
  // 按部位分组，保持记录原始顺序
  const partMap = {};
  records.forEach(r => {
    if (parseRecordDate(r) !== dateKey) return;
    const part = r.bodyPart || '未分类';
    if (!partMap[part]) partMap[part] = { actions: [], recordIds: [] };
    partMap[part].recordIds.push(r.id);
    // 把该次训练的所有动作按顺序加入
    r.actions.forEach(a => {
      partMap[part].actions.push({
        actionName: a.actionName,
        groups: a.groups.map(g => ({ ...g }))
      });
    });
  });
  // 按 BODY_PARTS 顺序排列部位
  const orderedParts = BODY_PARTS.filter(p => partMap[p.name]);
  Object.keys(partMap).forEach(p => {
    if (!orderedParts.find(op => op.name === p)) {
      orderedParts.push({ name: p, icon: getPartIcon(p) });
    }
  });
  return orderedParts.map(p => ({
    name: p.name,
    icon: p.icon,
    actions: partMap[p.name].actions,
    recordIds: partMap[p.name].recordIds
  }));
}

/* 统一迁移：v1/v2 -> v3，给每个部位内的动作分配 order */
function assignOrders(actions) {
  const partMap = {};
  actions.forEach(a => {
    if (!partMap[a.bodyPart]) partMap[a.bodyPart] = 0;
    a.order = partMap[a.bodyPart]++;
  });
  return actions;
}

/* 补丁：为已有动作补上 prepareSeconds 字段（向后兼容） */
function patchPrepareSeconds() {
  const actions = getActions();
  let changed = false;
  actions.forEach(a => {
    if (a.prepareSeconds === undefined) { a.prepareSeconds = 15; changed = true; }
  });
  if (changed) saveActions(actions);
}

/* 补丁：为已有动作补上 targetSets 字段（向后兼容） */
function patchTargetSets() {
  const actions = getActions();
  let changed = false;
  actions.forEach(a => {
    if (a.targetSets === undefined) { a.targetSets = 3; changed = true; }
    // 补丁：为已有动作初始化 setsConfig
    if (!a.setsConfig || a.setsConfig.length === 0) {
      a.setsConfig = [];
      for (let i = 0; i < (a.targetSets ?? 3); i++) {
        a.setsConfig.push({ weight: a.defaultWeight, reps: a.defaultReps });
      }
      changed = true;
    }
  });
  if (changed) saveActions(actions);
}

/* ===== 二维码生成（自动替换为局域网IP；离线时降级为地址文本） ===== */
function showQRCode() {
  // localhost / 127.0.0.1 → 局域网 IP
  let url = location.href;
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    url = url.replace(location.hostname, '192.168.1.10');
  }
  const container = document.getElementById('qr-container');
  container.innerHTML = '';

  // 离线或二维码服务不可用：显示地址文本，供手机手动输入
  const showUrlFallback = () => {
    container.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'width:200px;padding:18px 14px;background:#f5f5f7;border-radius:12px;font-size:14px;color:#1d1d1f;word-break:break-all;text-align:center;font-weight:600';
    box.textContent = url;
    container.appendChild(box);
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:12px;color:#86868b;margin-top:8px;width:200px;text-align:center';
    hint.textContent = '离线模式：请在手机浏览器输入此地址';
    container.appendChild(hint);
  };

  if (!navigator.onLine) {
    showUrlFallback();
    document.getElementById('modal-qr').style.display = 'flex';
    return;
  }

  const img = document.createElement('img');
  img.width = 200; img.height = 200;
  img.style.cssText = 'display:block;border-radius:8px';
  img.alt = '二维码';
  img.onerror = showUrlFallback;
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
  container.appendChild(img);
  // 显示链接文字方便手动输入
  const linkDiv = document.createElement('div');
  linkDiv.style.cssText = 'font-size:12px;color:#86868b;margin-top:8px;word-break:break-all;width:200px;text-align:center';
  linkDiv.textContent = url;
  container.appendChild(linkDiv);
  document.getElementById('modal-qr').style.display = 'flex';
}

function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  const tab = document.querySelector(`.tab-item[data-view="${name}"]`);
  if (tab) tab.classList.add('active');
  // 标签栏始终显示；训练板块按状态进入「启动页」或「计时页」
  if (name === 'home') renderHome();
  if (name === 'settings') renderSettings();
  if (name === 'history') renderHistory();
  if (name === 'training') {
    // 训练页始终可进：无进行中训练时显示空状态提示
    const empty = document.getElementById('session-empty');
    const session = document.getElementById('training-session');
    if (training.active) {
      empty.style.display = 'none';
      showSession();
    } else {
      empty.style.display = 'flex';
    }
  }
  // 切页时把新页面的内部滚动体归位
  const viewEl = document.getElementById('view-' + name);
  const bodyEl = viewEl ? viewEl.querySelector('.view-body') : null;
  if (bodyEl) bodyEl.scrollTop = 0;
}

function pulse(elId) {

/* ============================================================
   首页：部位选择
   ============================================================ */
function renderHome() {
  const actions = getActions();
  const list = document.getElementById('part-list');
  // 统计每个部位的动作
  const partMap = {};
  BODY_PARTS.forEach(p => partMap[p.name] = []);
  actions.forEach(a => {
    if (!partMap[a.bodyPart]) partMap[a.bodyPart] = [];
    partMap[a.bodyPart].push(a);
  });

  // 过滤掉没有动作的部位，按持久化顺序排列
  const availableParts = getOrderedParts().filter(p => partMap[p.name] && partMap[p.name].length > 0);

  if (availableParts.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#86868b;padding:40px 0">还没有动作，去设置页添加吧</div>';
    return;
  }

  list.innerHTML = availableParts.map(p => {
    const partActions = partMap[p.name].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    return `
      <div class="part-card" id="part-${p.name}">
        <div class="part-head" onclick="togglePart('${p.name}')">
          <div class="part-icon">${icon(p.icon)}</div>
          <div class="part-info">
            <div class="part-name">${p.name}训练</div>
            <div class="part-count">${partActions.length} 个动作</div>
          </div>
          <div class="part-arrow">${icon('chevron-right')}</div>
        </div>
        <div class="part-actions">
          ${partActions.map(a => `
            <div class="part-action-item">
              <span class="part-action-name">${a.name}</span>
              <span class="part-action-defaults">${a.defaultWeight}kg×${a.defaultReps}次</span>
            </div>
          `).join('')}
        </div>
        <button class="part-start-btn" onclick="startPartTraining('${p.name}')">开始${p.name}训练 →</button>

}

  actions: [],
  actionIndex: 0,
  currentAction: null,
  bodyPart: '',
  weight: 0,
  reps: 0,
  currentGroup: 1,
  totalGroups: 1,
  phase: 'idle',          // idle | preparing | training | resting
  timerDisplay: '00:00',  // 主显示：开始倒计时/训练正计时/休息倒计时
  timerLabel: '准备开始第一组',
  trainingSeconds: 0,     // 训练正计时（秒）
  restSeconds: 0,         // 剩余休息秒数
  prepareSeconds: 0,      // 剩余开始倒计时秒数
  restVibrationFired: false, // 休息30秒震动是否已触发
  restDurationTotal: 0,      // 本次休息的总时长（含调节），用于回填到上一组的 restDuration
  trainingLog: [],
